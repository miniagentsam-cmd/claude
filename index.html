<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Reality Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1a1a1d;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --accent: #f7931a;
            --red: #ef4444;
            --green: #22c55e;
            --border: #2a2a2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 1.5rem 0 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .main-card {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .price-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .price-change {
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .price-change.positive { color: var(--green); }
        .price-change.negative { color: var(--red); }

        .reality-box {
            background: var(--bg-tertiary);
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-top: 1.25rem;
            border-left: 3px solid var(--red);
        }

        .reality-box.positive {
            border-left-color: var(--green);
        }

        .reality-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .reality-message {
            font-size: 1rem;
            line-height: 1.6;
        }

        .reality-message strong {
            color: var(--accent);
        }

        .reality-stat {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        .reality-stat.red { color: var(--red); }
        .reality-stat.green { color: var(--green); }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .ath-timeline {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ath-item {
            background: var(--bg-secondary);
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid var(--border);
        }

        .ath-item.longest-drawdown {
            border-color: var(--red);
            background: linear-gradient(135deg, var(--bg-secondary), rgba(239, 68, 68, 0.1));
        }

        .ath-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .ath-year {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .ath-price {
            color: var(--accent);
            font-weight: 600;
        }

        .ath-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .ath-recovery {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
        }

        .ath-recovery.underwater {
            color: var(--red);
        }

        .ath-recovery.recovered {
            color: var(--green);
        }

        .drawdown-badge {
            display: inline-block;
            background: var(--red);
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
        }

        .status-bar {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: var(--bg-secondary);
            border: 1px solid var(--red);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
        }

        .error p {
            color: var(--red);
            margin-bottom: 1rem;
        }

        .error .debug {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: left;
            white-space: pre-wrap;
            margin: 1rem 0;
            padding: 0.5rem;
            background: var(--bg-primary);
            border-radius: 0.5rem;
        }

        button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>₿ BTC Reality Check</h1>
            <p class="subtitle">How long have you been waiting?</p>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading Bitcoin data...</p>
            </div>
        </div>

        <div class="status-bar" id="status">Loading...</div>

        <div class="footer">
            Data from <a href="https://www.cryptocompare.com" target="_blank">CryptoCompare</a> & <a href="https://coinbase.com" target="_blank">Coinbase</a>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        const status = document.getElementById('status');
        let historicalData = null;
        let debugLog = [];

        function log(msg) {
            debugLog.push(msg);
            if (debugLog.length > 15) debugLog.shift();
        }

        function formatPrice(price) {
            if (price >= 1000) {
                return '$' + Math.round(price).toLocaleString('en-US');
            }
            return '$' + price.toFixed(2);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function daysBetween(date1, date2) {
            return Math.floor((date2 - date1) / (1000 * 60 * 60 * 24));
        }

        function formatDays(days) {
            if (days >= 365) {
                const years = Math.floor(days / 365);
                const remainingDays = days % 365;
                if (remainingDays > 30) {
                    const months = Math.floor(remainingDays / 30);
                    return years + 'y ' + months + 'mo';
                }
                return years + ' year' + (years > 1 ? 's' : '');
            }
            return days + ' days';
        }

        async function fetchCurrentPrice() {
            log('Fetching price...');
            try {
                const res = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
                if (res.ok) {
                    const json = await res.json();
                    log('Price OK: $' + parseFloat(json.data.amount).toFixed(0));
                    return parseFloat(json.data.amount);
                }
            } catch (e) { log('Coinbase error: ' + e.message); }

            try {
                const res = await fetch('https://api.coincap.io/v2/assets/bitcoin');
                if (res.ok) {
                    const json = await res.json();
                    return parseFloat(json.data.priceUsd);
                }
            } catch (e) { log('CoinCap error: ' + e.message); }

            throw new Error('Could not fetch price');
        }

        async function fetchHistoricalData() {
            if (historicalData) return historicalData;

            log('Fetching history...');
            try {
                const res = await fetch('https://min-api.cryptocompare.com/data/v2/histoday?fsym=BTC&tsym=USD&limit=2000&toTs=' + Math.floor(Date.now()/1000));
                log('CryptoCompare status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.Response === 'Success' && json.Data && json.Data.Data) {
                        historicalData = json.Data.Data.map(d => ({
                            date: new Date(d.time * 1000),
                            price: d.close,
                            high: d.high
                        })).filter(d => d.price > 0);
                        log('History OK: ' + historicalData.length + ' days');
                        return historicalData;
                    }
                }
            } catch (e) { log('History error: ' + e.message); }

            throw new Error('Could not fetch history');
        }

        function findFirstPriceMatch(currentPrice, data) {
            const tolerance = currentPrice * 0.02;
            for (const entry of data) {
                if (entry.price >= currentPrice - tolerance && entry.price <= currentPrice + tolerance) {
                    return entry;
                }
            }
            return null;
        }

        function calculateYearlyATHs(data) {
            const athByYear = {};
            const now = new Date();

            // Find ATH for each year
            for (const entry of data) {
                const year = entry.date.getFullYear();
                if (!athByYear[year] || entry.high > athByYear[year].price) {
                    athByYear[year] = {
                        year: year,
                        price: entry.high,
                        date: entry.date
                    };
                }
            }

            // Convert to array and sort
            const athList = Object.values(athByYear).sort((a, b) => a.year - b.year);

            // Calculate recovery times
            let runningATH = 0;
            for (let i = 0; i < athList.length; i++) {
                const ath = athList[i];

                if (ath.price > runningATH) {
                    runningATH = ath.price;
                    ath.wasNewATH = true;
                }

                // Find when this ATH was surpassed
                ath.recoveryDays = null;
                ath.recoveredDate = null;

                for (const entry of data) {
                    if (entry.date > ath.date && entry.price > ath.price) {
                        ath.recoveryDays = daysBetween(ath.date, entry.date);
                        ath.recoveredDate = entry.date;
                        break;
                    }
                }

                // If not recovered, calculate days since ATH
                if (!ath.recoveryDays) {
                    ath.daysUnderwater = daysBetween(ath.date, now);
                }
            }

            return athList;
        }

        function findLongestDrawdown(athList) {
            let longest = null;
            for (const ath of athList) {
                const days = ath.recoveryDays || ath.daysUnderwater || 0;
                if (!longest || days > (longest.recoveryDays || longest.daysUnderwater || 0)) {
                    longest = ath;
                }
            }
            return longest;
        }

        function render(currentPrice, history) {
            const firstMatch = findFirstPriceMatch(currentPrice, history);
            const athList = calculateYearlyATHs(history);
            const longestDrawdown = findLongestDrawdown(athList);
            const now = new Date();

            let daysAtPrice = 0;
            let firstDate = null;
            if (firstMatch) {
                daysAtPrice = daysBetween(firstMatch.date, now);
                firstDate = firstMatch.date;
            }

            // Get current ATH
            const currentATH = Math.max(...history.map(d => d.high));
            const athEntry = history.find(d => d.high === currentATH);
            const percentFromATH = ((currentPrice - currentATH) / currentATH * 100).toFixed(1);

            let html = `
                <div class="main-card">
                    <div class="price-label">Current Bitcoin Price</div>
                    <div class="price">${formatPrice(currentPrice)}</div>
                    <div class="price-change ${parseFloat(percentFromATH) >= 0 ? 'positive' : 'negative'}">
                        ${percentFromATH}% from ATH (${formatPrice(currentATH)})
                    </div>

                    <div class="reality-box ${daysAtPrice === 0 ? 'positive' : ''}">
                        <div class="reality-title">💡 Reality Check</div>
            `;

            if (firstMatch && daysAtPrice > 30) {
                html += `
                    <div class="reality-stat red">${formatDays(daysAtPrice)}</div>
                    <div class="reality-message">
                        BTC first hit <strong>${formatPrice(currentPrice)}</strong> on <strong>${formatDate(firstDate)}</strong>.<br>
                        If you bought then, you've had <strong>0% return</strong> for ${formatDays(daysAtPrice)}.
                    </div>
                `;
            } else if (firstMatch) {
                html += `
                    <div class="reality-stat green">New Territory!</div>
                    <div class="reality-message">
                        BTC just reached this price level within the last month.
                    </div>
                `;
            } else {
                html += `
                    <div class="reality-stat green">All-Time High Zone!</div>
                    <div class="reality-message">
                        This price has never been seen before. You're witnessing history.
                    </div>
                `;
            }

            html += `</div></div>`;

            // ATH Timeline
            html += `<div class="section-title">📊 Yearly All-Time Highs</div>`;
            html += `<div class="ath-timeline">`;

            // Show last 10 years or so
            const recentATHs = athList.filter(a => a.year >= 2013);

            for (const ath of recentATHs.reverse()) {
                const isLongest = longestDrawdown && ath.year === longestDrawdown.year;

                html += `
                    <div class="ath-item ${isLongest ? 'longest-drawdown' : ''}">
                        <div class="ath-header">
                            <span class="ath-year">${ath.year}</span>
                            <span class="ath-price">${formatPrice(ath.price)}</span>
                        </div>
                        <div class="ath-date">Peak: ${formatDate(ath.date)}</div>
                        <div class="ath-recovery ${ath.recoveryDays ? 'recovered' : 'underwater'}">
                `;

                if (ath.recoveryDays) {
                    html += `✓ Surpassed after ${formatDays(ath.recoveryDays)}`;
                } else if (ath.daysUnderwater) {
                    html += `⏳ Still waiting... ${formatDays(ath.daysUnderwater)} and counting`;
                    if (isLongest) {
                        html += `<span class="drawdown-badge">Longest Wait</span>`;
                    }
                }

                html += `</div></div>`;
            }

            html += `</div>`;

            app.innerHTML = html;
            status.textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · Refreshes every 60s';
        }

        function showError(message) {
            app.innerHTML = `
                <div class="error">
                    <p>😵 ${message}</p>
                    <div class="debug">${debugLog.join('\n')}</div>
                    <button onclick="debugLog=[];refresh()">Try Again</button>
                </div>
            `;
            status.textContent = 'Error loading data';
        }

        async function refresh() {
            try {
                status.textContent = 'Loading...';
                const [price, history] = await Promise.all([
                    fetchCurrentPrice(),
                    fetchHistoricalData()
                ]);
                render(price, history);
            } catch (e) {
                log('ERROR: ' + e.message);
                showError(e.message);
            }
        }

        refresh();
        setInterval(refresh, 60000);
    </script>
</body>
</html>
