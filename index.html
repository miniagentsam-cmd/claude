<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Reality Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1a1a1d;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --accent: #f7931a;
            --red: #ef4444;
            --green: #22c55e;
            --border: #2a2a2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 1.5rem 0 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .main-card {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .price-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .price-change {
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .price-change.positive { color: var(--green); }
        .price-change.negative { color: var(--red); }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .ath-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .ath-table th {
            text-align: left;
            padding: 0.75rem 0.5rem;
            border-bottom: 2px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .ath-table th:last-child,
        .ath-table td:last-child {
            text-align: right;
        }

        .ath-table td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .ath-table tr:hover {
            background: var(--bg-secondary);
        }

        .ath-table .year {
            font-weight: 600;
        }

        .ath-table .price {
            color: var(--accent);
            font-size: 0.85rem;
        }

        .ath-table .positive {
            color: var(--green);
        }

        .ath-table .negative {
            color: var(--red);
        }

        .status-bar {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: var(--bg-secondary);
            border: 1px solid var(--red);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
        }

        .error p {
            color: var(--red);
            margin-bottom: 1rem;
        }

        .error .debug {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: left;
            white-space: pre-wrap;
            margin: 1rem 0;
            padding: 0.5rem;
            background: var(--bg-primary);
            border-radius: 0.5rem;
        }

        button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>₿ BTC Reality Check</h1>
            <p class="subtitle">Returns from all time highs</p>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading Bitcoin data...</p>
            </div>
        </div>

        <div class="status-bar" id="status">Loading...</div>

        <div class="footer">
            Data from <a href="https://www.cryptocompare.com" target="_blank">CryptoCompare</a> & <a href="https://coinbase.com" target="_blank">Coinbase</a>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        const status = document.getElementById('status');
        let historicalData = null;
        let debugLog = [];

        function log(msg) {
            debugLog.push(msg);
            if (debugLog.length > 15) debugLog.shift();
        }

        function formatPrice(price) {
            if (price >= 1000) {
                return '$' + Math.round(price).toLocaleString('en-US');
            }
            return '$' + price.toFixed(2);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function daysBetween(date1, date2) {
            return Math.floor((date2 - date1) / (1000 * 60 * 60 * 24));
        }

        function formatDays(days) {
            if (days >= 365) {
                const years = Math.floor(days / 365);
                const remainingDays = days % 365;
                if (remainingDays > 30) {
                    const months = Math.floor(remainingDays / 30);
                    return years + 'y ' + months + 'mo';
                }
                return years + ' year' + (years > 1 ? 's' : '');
            }
            return days + ' days';
        }

        async function fetchCurrentPrice() {
            log('Fetching price...');
            try {
                const res = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
                if (res.ok) {
                    const json = await res.json();
                    log('Price OK: $' + parseFloat(json.data.amount).toFixed(0));
                    return parseFloat(json.data.amount);
                }
            } catch (e) { log('Coinbase error: ' + e.message); }

            try {
                const res = await fetch('https://api.coincap.io/v2/assets/bitcoin');
                if (res.ok) {
                    const json = await res.json();
                    return parseFloat(json.data.priceUsd);
                }
            } catch (e) { log('CoinCap error: ' + e.message); }

            throw new Error('Could not fetch price');
        }

        async function fetchHistoricalData() {
            if (historicalData) return historicalData;

            log('Fetching history...');
            try {
                // Use allData=true to get full BTC history back to 2010
                const res = await fetch('https://min-api.cryptocompare.com/data/v2/histoday?fsym=BTC&tsym=USD&allData=true');
                log('CryptoCompare status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.Response === 'Success' && json.Data && json.Data.Data) {
                        historicalData = json.Data.Data.map(d => ({
                            date: new Date(d.time * 1000),
                            price: d.close,
                            high: d.high
                        })).filter(d => d.price > 0);
                        log('History OK: ' + historicalData.length + ' days');
                        return historicalData;
                    }
                }
            } catch (e) { log('History error: ' + e.message); }

            throw new Error('Could not fetch history');
        }

        function findFirstPriceMatch(currentPrice, data) {
            const tolerance = currentPrice * 0.02;
            for (const entry of data) {
                if (entry.price >= currentPrice - tolerance && entry.price <= currentPrice + tolerance) {
                    return entry;
                }
            }
            return null;
        }

        function calculateYearlyATHs(data) {
            const athByYear = {};
            const now = new Date();

            // Find ATH for each year
            for (const entry of data) {
                const year = entry.date.getFullYear();
                if (!athByYear[year] || entry.high > athByYear[year].price) {
                    athByYear[year] = {
                        year: year,
                        price: entry.high,
                        date: entry.date
                    };
                }
            }

            // Convert to array and sort
            const athList = Object.values(athByYear).sort((a, b) => a.year - b.year);

            // Calculate recovery times
            let runningATH = 0;
            for (let i = 0; i < athList.length; i++) {
                const ath = athList[i];

                if (ath.price > runningATH) {
                    runningATH = ath.price;
                    ath.wasNewATH = true;
                }

                // Find when this ATH was surpassed
                ath.recoveryDays = null;
                ath.recoveredDate = null;

                for (const entry of data) {
                    if (entry.date > ath.date && entry.price > ath.price) {
                        ath.recoveryDays = daysBetween(ath.date, entry.date);
                        ath.recoveredDate = entry.date;
                        break;
                    }
                }

                // If not recovered, calculate days since ATH
                if (!ath.recoveryDays) {
                    ath.daysUnderwater = daysBetween(ath.date, now);
                }
            }

            return athList;
        }

        function findLongestDrawdown(athList) {
            let longest = null;
            for (const ath of athList) {
                const days = ath.recoveryDays || ath.daysUnderwater || 0;
                if (!longest || days > (longest.recoveryDays || longest.daysUnderwater || 0)) {
                    longest = ath;
                }
            }
            return longest;
        }

        function render(currentPrice, history) {
            const athList = calculateYearlyATHs(history);
            const now = new Date();

            // Get current ATH
            const currentATH = Math.max(...history.map(d => d.high));
            const percentFromATH = ((currentPrice - currentATH) / currentATH * 100).toFixed(1);

            let html = `
                <div class="main-card">
                    <div class="price-label">Current Bitcoin Price</div>
                    <div class="price">${formatPrice(currentPrice)}</div>
                    <div class="price-change ${parseFloat(percentFromATH) >= 0 ? 'positive' : 'negative'}">
                        ${percentFromATH}% from ATH (${formatPrice(currentATH)})
                    </div>
                </div>
            `;

            // ATH Table
            html += `<div class="section-title">📊 If You Bought the ATH Each Year</div>`;
            html += `
                <table class="ath-table">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>ATH</th>
                            <th>Returns</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Show all years from data, oldest first
            for (const ath of athList) {
                const percentReturn = ((currentPrice - ath.price) / ath.price * 100);
                const yearsHeld = (now - ath.date) / (1000 * 60 * 60 * 24 * 365);
                const cagr = yearsHeld > 0.1 ? (Math.pow(currentPrice / ath.price, 1 / yearsHeld) - 1) * 100 : 0;

                let returnsDisplay;
                let returnsClass;

                if (percentReturn >= 0) {
                    // Profit: show CAGR
                    returnsClass = 'positive';
                    returnsDisplay = '+' + cagr.toFixed(1) + '% CAGR';
                } else {
                    // Loss: show total % lost
                    returnsClass = 'negative';
                    returnsDisplay = percentReturn.toFixed(0) + '%';
                }

                html += `
                    <tr>
                        <td class="year">${ath.year}</td>
                        <td class="price">${formatPrice(ath.price)}</td>
                        <td class="${returnsClass}">${returnsDisplay}</td>
                    </tr>
                `;
            }

            html += `</tbody></table>`;

            app.innerHTML = html;
            status.textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · Refreshes every 60s';
        }

        function showError(message) {
            app.innerHTML = `
                <div class="error">
                    <p>😵 ${message}</p>
                    <div class="debug">${debugLog.join('\n')}</div>
                    <button onclick="debugLog=[];refresh()">Try Again</button>
                </div>
            `;
            status.textContent = 'Error loading data';
        }

        async function refresh() {
            try {
                status.textContent = 'Loading...';
                const [price, history] = await Promise.all([
                    fetchCurrentPrice(),
                    fetchHistoricalData()
                ]);
                render(price, history);
            } catch (e) {
                log('ERROR: ' + e.message);
                showError(e.message);
            }
        }

        refresh();
        setInterval(refresh, 60000);
    </script>
</body>
</html>
