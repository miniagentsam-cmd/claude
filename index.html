<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Déjà Vu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #f7931a;
            --accent-glow: rgba(247, 147, 26, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }

        .price-card {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .price-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .price {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 0.25rem;
        }

        @media (max-width: 360px) {
            .price {
                font-size: 2.5rem;
            }
        }

        .price-change {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .deja-vu-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #1a2332 100%);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(247, 147, 26, 0.2);
        }

        .deja-vu-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .deja-vu-message {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .deja-vu-message strong {
            color: var(--accent);
        }

        .time-ago {
            display: inline-block;
            background: rgba(247, 147, 26, 0.15);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #238636;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.loading {
            background: var(--accent);
        }

        .status-dot.error {
            background: #f85149;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-state {
            padding: 3rem 1.5rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            color: #f85149;
            padding: 2rem;
        }

        .error-state button {
            margin-top: 1rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .error-state button:hover {
            opacity: 0.9;
        }

        .never-before {
            background: linear-gradient(135deg, #238636 0%, #1a7f37 100%);
            border: 1px solid rgba(35, 134, 54, 0.3);
        }

        .never-before .deja-vu-icon {
            color: #3fb950;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">₿</div>
        <h1>BTC Déjà Vu</h1>
        <p class="subtitle">Have we been here before?</p>

        <div id="app">
            <div class="price-card loading-state">
                <div class="spinner"></div>
                <p>Fetching Bitcoin data...</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot loading" id="status-dot"></div>
            <span id="status-text">Loading...</span>
        </div>

        <div class="footer">
            Data from <a href="https://www.coincap.io" target="_blank" rel="noopener">CoinCap</a> & <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko</a>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let historicalData = null;
        let lastUpdate = null;

        // Format price with commas
        function formatPrice(price) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(price);
        }

        // Format date nicely
        function formatDate(date) {
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }).format(date);
        }

        // Calculate time difference
        function getTimeDifference(pastDate) {
            const now = new Date();
            const past = new Date(pastDate);

            let years = now.getFullYear() - past.getFullYear();
            let months = now.getMonth() - past.getMonth();
            let days = now.getDate() - past.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const parts = [];
            if (years > 0) parts.push(`${years} year${years !== 1 ? 's' : ''}`);
            if (months > 0) parts.push(`${months} month${months !== 1 ? 's' : ''}`);
            if (days > 0) parts.push(`${days} day${days !== 1 ? 's' : ''}`);

            return parts.length > 0 ? parts.join(', ') : 'today';
        }

        // Find the first date BTC hit the current price (within a tolerance)
        function findFirstPriceMatch(currentPrice, data) {
            // Use a 2% tolerance for price matching
            const tolerance = currentPrice * 0.02;
            const minPrice = currentPrice - tolerance;
            const maxPrice = currentPrice + tolerance;

            for (const entry of data) {
                if (entry.price >= minPrice && entry.price <= maxPrice) {
                    return {
                        date: new Date(entry.timestamp),
                        price: entry.price
                    };
                }
            }

            return null;
        }

        // Fetch with timeout
        async function fetchWithTimeout(url, timeout = 10000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }

        // Try multiple APIs with fallback
        async function tryFetch(attempts) {
            let lastError;

            for (const attempt of attempts) {
                try {
                    const response = await fetchWithTimeout(attempt.url);
                    if (response.ok) {
                        const data = await response.json();
                        return attempt.transform(data);
                    }
                } catch (error) {
                    lastError = error;
                    console.warn(`API attempt failed: ${attempt.url}`, error.message);
                }
            }

            throw lastError || new Error('All API attempts failed');
        }

        // Fetch current price with multiple fallbacks
        async function fetchCurrentPrice() {
            return tryFetch([
                {
                    // CoinCap API (has CORS headers)
                    url: 'https://api.coincap.io/v2/assets/bitcoin',
                    transform: (data) => ({
                        price: parseFloat(data.data.priceUsd),
                        change24h: parseFloat(data.data.changePercent24Hr) || 0
                    })
                },
                {
                    // Coinbase API (also CORS-friendly)
                    url: 'https://api.coinbase.com/v2/prices/BTC-USD/spot',
                    transform: (data) => ({
                        price: parseFloat(data.data.amount),
                        change24h: 0 // Coinbase spot doesn't include 24h change
                    })
                },
                {
                    // Blockchain.info (CORS-friendly)
                    url: 'https://blockchain.info/ticker',
                    transform: (data) => ({
                        price: data.USD.last,
                        change24h: 0
                    })
                }
            ]);
        }

        // Fetch historical data with caching and CORS proxy fallbacks
        async function fetchHistoricalData() {
            if (historicalData) return historicalData;

            const coingeckoUrl = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=max&interval=daily';

            // CORS proxy options for CoinGecko historical data
            const attempts = [
                // Try direct first (sometimes works)
                coingeckoUrl,
                // CORS proxies as fallbacks
                `https://corsproxy.io/?${encodeURIComponent(coingeckoUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(coingeckoUrl)}`,
            ];

            let lastError;

            for (const url of attempts) {
                try {
                    console.log(`Trying historical data from: ${url.substring(0, 50)}...`);
                    const response = await fetchWithTimeout(url, 30000);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.prices && data.prices.length > 0) {
                        // Transform CoinGecko format [timestamp, price] to our format
                        historicalData = data.prices.map(([timestamp, price]) => ({
                            timestamp,
                            price
                        }));

                        console.log(`Loaded ${historicalData.length} days of historical data`);
                        return historicalData;
                    }
                } catch (error) {
                    console.warn(`Historical data attempt failed: ${error.message}`);
                    lastError = error;
                }
            }

            throw new Error('Could not load historical price data. Please try again.');
        }

        // Update the UI
        function updateUI(currentPrice, change24h, matchData) {
            const changeSign = change24h >= 0 ? '+' : '';

            let dejaVuContent;

            if (matchData) {
                const timeAgo = getTimeDifference(matchData.date);
                dejaVuContent = `
                    <div class="deja-vu-card">
                        <div class="deja-vu-icon">⏳</div>
                        <p class="deja-vu-message">
                            Bitcoin first hit <strong>${formatPrice(currentPrice)}</strong> on
                            <strong>${formatDate(matchData.date)}</strong>
                        </p>
                        <span class="time-ago">${timeAgo} ago</span>
                    </div>
                `;
            } else {
                dejaVuContent = `
                    <div class="deja-vu-card never-before">
                        <div class="deja-vu-icon">🚀</div>
                        <p class="deja-vu-message">
                            <strong>${formatPrice(currentPrice)}</strong> is uncharted territory!
                            <br>Bitcoin has never been at this price before.
                        </p>
                        <span class="time-ago">Making history</span>
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="price-card">
                    <p class="price-label">Current Bitcoin Price</p>
                    <p class="price">${formatPrice(currentPrice)}</p>
                    <p class="price-change">${changeSign}${change24h.toFixed(2)}% (24h)</p>
                </div>
                ${dejaVuContent}
            `;
        }

        // Show error state
        function showError(message) {
            app.innerHTML = `
                <div class="price-card error-state">
                    <p>😵 ${message}</p>
                    <button onclick="refresh()">Try Again</button>
                </div>
            `;
            statusDot.className = 'status-dot error';
            statusText.textContent = 'Connection error';
        }

        // Set loading state
        function setLoading(isLoading, message = 'Updating...') {
            if (isLoading) {
                statusDot.className = 'status-dot loading';
                statusText.textContent = message;
            } else {
                statusDot.className = 'status-dot';
                lastUpdate = new Date();
                statusText.textContent = `Updated ${lastUpdate.toLocaleTimeString()}`;
            }
        }

        // Main refresh function
        async function refresh() {
            try {
                setLoading(true, 'Fetching current price...');

                const priceData = await fetchCurrentPrice();

                setLoading(true, 'Loading historical data...');
                const history = await fetchHistoricalData();

                const matchData = findFirstPriceMatch(priceData.price, history);

                updateUI(priceData.price, priceData.change24h, matchData);
                setLoading(false);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message || 'Could not fetch Bitcoin data. Please try again.');
            }
        }

        // Update countdown timer
        function updateCountdown() {
            if (!lastUpdate) return;

            const elapsed = Math.floor((Date.now() - lastUpdate.getTime()) / 1000);
            const remaining = 60 - elapsed;

            if (remaining > 0) {
                statusText.textContent = `Updated ${lastUpdate.toLocaleTimeString()} · Next update in ${remaining}s`;
            }
        }

        // Initialize
        refresh();

        // Auto-refresh every 60 seconds
        setInterval(refresh, 60000);

        // Update countdown every second
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
