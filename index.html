<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Déjà Vu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #f7931a;
            --accent-glow: rgba(247, 147, 26, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }

        .price-card {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .price-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .price {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 0.25rem;
        }

        @media (max-width: 360px) {
            .price {
                font-size: 2.5rem;
            }
        }

        .price-change {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .deja-vu-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #1a2332 100%);
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(247, 147, 26, 0.2);
        }

        .deja-vu-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .deja-vu-message {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .deja-vu-message strong {
            color: var(--accent);
        }

        .time-ago {
            display: inline-block;
            background: rgba(247, 147, 26, 0.15);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #238636;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.loading {
            background: var(--accent);
        }

        .status-dot.error {
            background: #f85149;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-state {
            padding: 3rem 1.5rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            color: #f85149;
            padding: 2rem;
        }

        .error-state button {
            margin-top: 1rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .error-state button:hover {
            opacity: 0.9;
        }

        .never-before {
            background: linear-gradient(135deg, #238636 0%, #1a7f37 100%);
            border: 1px solid rgba(35, 134, 54, 0.3);
        }

        .never-before .deja-vu-icon {
            color: #3fb950;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">₿</div>
        <h1>BTC Déjà Vu</h1>
        <p class="subtitle">Have we been here before?</p>

        <div id="app">
            <div class="price-card loading-state">
                <div class="spinner"></div>
                <p>Fetching Bitcoin data...</p>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-dot loading" id="status-dot"></div>
            <span id="status-text">Loading...</span>
        </div>

        <div class="footer">
            Data from <a href="https://www.coincap.io" target="_blank" rel="noopener">CoinCap</a>
        </div>
    </div>

    <script>
        const app = document.getElementById('app');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let historicalData = null;
        let lastUpdate = null;
        let debugLog = [];

        function log(msg) {
            debugLog.push(msg);
            if (debugLog.length > 10) debugLog.shift();
        }

        function formatPrice(price) {
            return '$' + Math.round(price).toLocaleString('en-US');
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function getTimeDifference(pastDate) {
            const now = new Date();
            const past = new Date(pastDate);
            let years = now.getFullYear() - past.getFullYear();
            let months = now.getMonth() - past.getMonth();
            let days = now.getDate() - past.getDate();
            if (days < 0) { months--; days += 30; }
            if (months < 0) { years--; months += 12; }
            const parts = [];
            if (years > 0) parts.push(years + ' year' + (years !== 1 ? 's' : ''));
            if (months > 0) parts.push(months + ' month' + (months !== 1 ? 's' : ''));
            if (days > 0) parts.push(days + ' day' + (days !== 1 ? 's' : ''));
            return parts.length > 0 ? parts.join(', ') : 'today';
        }

        function findFirstPriceMatch(currentPrice, data) {
            const tolerance = currentPrice * 0.02;
            for (const entry of data) {
                if (entry.price >= currentPrice - tolerance && entry.price <= currentPrice + tolerance) {
                    return { date: new Date(entry.time), price: entry.price };
                }
            }
            return null;
        }

        async function fetchCurrentPrice() {
            log('Trying CoinCap price...');
            try {
                const res = await fetch('https://api.coincap.io/v2/assets/bitcoin');
                log('CoinCap status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.data && json.data.priceUsd) {
                        log('CoinCap OK: $' + parseFloat(json.data.priceUsd).toFixed(0));
                        return {
                            price: parseFloat(json.data.priceUsd),
                            change24h: parseFloat(json.data.changePercent24Hr) || 0
                        };
                    }
                }
            } catch (e) { log('CoinCap error: ' + e.message); }

            log('Trying Coinbase price...');
            try {
                const res = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
                log('Coinbase status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.data && json.data.amount) {
                        log('Coinbase OK: $' + parseFloat(json.data.amount).toFixed(0));
                        return { price: parseFloat(json.data.amount), change24h: 0 };
                    }
                }
            } catch (e) { log('Coinbase error: ' + e.message); }

            throw new Error('Price APIs failed');
        }

        async function fetchHistoricalData() {
            if (historicalData) {
                log('Using cached history (' + historicalData.length + ' days)');
                return historicalData;
            }

            log('Trying CoinCap history...');
            try {
                const res = await fetch('https://api.coincap.io/v2/assets/bitcoin/history?interval=d1');
                log('CoinCap history status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.data && json.data.length > 0) {
                        historicalData = json.data.map(d => ({ time: d.time, price: parseFloat(d.priceUsd) }));
                        log('CoinCap history OK: ' + historicalData.length + ' days');
                        return historicalData;
                    } else {
                        log('CoinCap history empty');
                    }
                }
            } catch (e) { log('CoinCap history error: ' + e.message); }

            log('Trying CoinGecko proxy...');
            const geckoUrl = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=2000&interval=daily';

            try {
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(geckoUrl);
                log('Proxy: corsproxy.io');
                const res = await fetch(proxyUrl);
                log('Proxy status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.prices && json.prices.length > 0) {
                        historicalData = json.prices.map(p => ({ time: p[0], price: p[1] }));
                        log('Proxy OK: ' + historicalData.length + ' days');
                        return historicalData;
                    }
                }
            } catch (e) { log('Proxy error: ' + e.message); }

            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(geckoUrl);
                log('Proxy: allorigins');
                const res = await fetch(proxyUrl);
                log('Proxy status: ' + res.status);
                if (res.ok) {
                    const json = await res.json();
                    if (json.prices && json.prices.length > 0) {
                        historicalData = json.prices.map(p => ({ time: p[0], price: p[1] }));
                        log('Proxy OK: ' + historicalData.length + ' days');
                        return historicalData;
                    }
                }
            } catch (e) { log('Proxy error: ' + e.message); }

            throw new Error('History APIs failed');
        }

        function updateUI(currentPrice, change24h, matchData) {
            const changeSign = change24h >= 0 ? '+' : '';
            let dejaVuContent;
            if (matchData) {
                const timeAgo = getTimeDifference(matchData.date);
                dejaVuContent = '<div class="deja-vu-card"><div class="deja-vu-icon">⏳</div>' +
                    '<p class="deja-vu-message">Bitcoin first hit <strong>' + formatPrice(currentPrice) +
                    '</strong> on <strong>' + formatDate(matchData.date) + '</strong></p>' +
                    '<span class="time-ago">' + timeAgo + ' ago</span></div>';
            } else {
                dejaVuContent = '<div class="deja-vu-card never-before"><div class="deja-vu-icon">🚀</div>' +
                    '<p class="deja-vu-message"><strong>' + formatPrice(currentPrice) +
                    '</strong> is uncharted territory!<br>Bitcoin has never been at this price before.</p>' +
                    '<span class="time-ago">Making history</span></div>';
            }
            app.innerHTML = '<div class="price-card"><p class="price-label">Current Bitcoin Price</p>' +
                '<p class="price">' + formatPrice(currentPrice) + '</p>' +
                '<p class="price-change">' + changeSign + change24h.toFixed(2) + '% (24h)</p></div>' + dejaVuContent;
        }

        function showError(message) {
            app.innerHTML = '<div class="price-card error-state"><p>😵 ' + message + '</p>' +
                '<p style="font-size:0.7rem;margin-top:1rem;color:#8b949e;text-align:left;white-space:pre-wrap;">' +
                debugLog.join('\n') + '</p>' +
                '<button onclick="debugLog=[];refresh()">Try Again</button></div>';
            statusDot.className = 'status-dot error';
            statusText.textContent = 'Error';
        }

        function setLoading(isLoading, message) {
            if (isLoading) {
                statusDot.className = 'status-dot loading';
                statusText.textContent = message || 'Loading...';
            } else {
                statusDot.className = 'status-dot';
                lastUpdate = new Date();
                statusText.textContent = 'Updated ' + lastUpdate.toLocaleTimeString();
            }
        }

        async function refresh() {
            try {
                setLoading(true, 'Fetching price...');
                const priceData = await fetchCurrentPrice();
                setLoading(true, 'Loading history...');
                const history = await fetchHistoricalData();
                const matchData = findFirstPriceMatch(priceData.price, history);
                updateUI(priceData.price, priceData.change24h, matchData);
                setLoading(false);
            } catch (error) {
                log('FINAL ERROR: ' + error.message);
                showError(error.message);
            }
        }

        function updateCountdown() {
            if (!lastUpdate) return;
            const remaining = 60 - Math.floor((Date.now() - lastUpdate.getTime()) / 1000);
            if (remaining > 0) {
                statusText.textContent = 'Updated ' + lastUpdate.toLocaleTimeString() + ' · Next in ' + remaining + 's';
            }
        }

        refresh();
        setInterval(refresh, 60000);
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
